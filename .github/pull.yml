version: "1"
rules:                       # Array of rules
  - base: master               # Required. Target branch
    upstream: jaywcjlove:master  # Required. Must be in the same fork network.
    mergeMethod: hardreset   # Optional, one of [none, merge, squash, rebase, hardreset], Default: none.
    mergeUnstable: true      # Optional, merge pull request even when the mergeable_state is not clean. Default: false
  - base: alfred               # Required. Target branch
    upstream: jaywcjlove:alfred  # Required. Must be in the same fork network.
    mergeMethod: hardreset   # Optional, one of [none, merge, squash, rebase, hardreset], Default: none.
    mergeUnstable: true      # Optional, merge pull request even when the mergeable_state is not clean. Default: false
  - base: gh-pages               # Required. Target branch
    upstream: jaywcjlove:gh-pages  # Required. Must be in the same fork network.
    mergeMethod: hardreset   # Optional, one of [none, merge, squash, rebase, hardreset], Default: none.
    mergeUnstable: true      # Optional, merge pull request even when the mergeable_state is not clean. Default: false
#   assignees:               # Optional
#     - dreamoeu
#   reviewers:               # Optional
#     - dreamoeu
#   conflictReviewers:       # Optional, on merge conflict assign a reviewer
#     - dreamoeu
label: ":arrow_heading_down: pull"  # Optional
conflictLabel: "merge-conflict"     # Optional, on merge conflict assign a custom label, Default: merge-conflict